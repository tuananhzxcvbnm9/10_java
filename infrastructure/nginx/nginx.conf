worker_processes auto;
events { worker_connections 1024; }
http {
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

  server {
    listen 80;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:;" always;

    location /app-01/ { proxy_pass http://app-01-frontend:80/; }
    location /app-02/ { proxy_pass http://app-02-frontend:80/; }
    location /app-03/ { proxy_pass http://app-03-frontend:80/; }
    location /app-04/ { proxy_pass http://app-04-frontend:80/; }
    location /app-05/ { proxy_pass http://app-05-frontend:80/; }
    location /app-06/ { proxy_pass http://app-06-frontend:80/; }
    location /app-07/ { proxy_pass http://app-07-frontend:80/; }
    location /app-08/ { proxy_pass http://app-08-frontend:80/; }
    location /app-09/ { proxy_pass http://app-09-frontend:80/; }
    location /app-10/ { proxy_pass http://app-10-frontend:80/; }

    location /api/ {
      limit_req zone=api_limit burst=40 nodelay;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Host $host;

      if ($request_uri ~* "^/api/app-01/") { proxy_pass http://app-01-backend:8080/; }
      if ($request_uri ~* "^/api/app-02/") { proxy_pass http://app-02-backend:8080/; }
      if ($request_uri ~* "^/api/app-03/") { proxy_pass http://app-03-backend:8080/; }
      if ($request_uri ~* "^/api/app-04/") { proxy_pass http://app-04-backend:8080/; }
      if ($request_uri ~* "^/api/app-05/") { proxy_pass http://app-05-backend:8080/; }
      if ($request_uri ~* "^/api/app-06/") { proxy_pass http://app-06-backend:8080/; }
      if ($request_uri ~* "^/api/app-07/") { proxy_pass http://app-07-backend:8080/; }
      if ($request_uri ~* "^/api/app-08/") { proxy_pass http://app-08-backend:8080/; }
      if ($request_uri ~* "^/api/app-09/") { proxy_pass http://app-09-backend:8080/; }
      if ($request_uri ~* "^/api/app-10/") { proxy_pass http://app-10-backend:8080/; }
    }
  }
}
