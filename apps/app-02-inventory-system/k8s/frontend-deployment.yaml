apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-02-frontend
  namespace: java-10-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-02-frontend
  template:
    metadata:
      labels:
        app: app-02-frontend
    spec:
      containers:
        - name: frontend
          image: app-02-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
